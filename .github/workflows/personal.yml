name: Personal plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -X utf8 tests/test_hidden_books.py
      - run: python -X utf8 tests/test_arrivals.py
      - run: python -X utf8 tests/test_personal_runtime.py
      - run: python -X utf8 scripts/package_personal.py
      - uses: actions/upload-artifact@v4
        with:
          name: simpleui-personal-${{ runner.os }}
          path: dist/*
