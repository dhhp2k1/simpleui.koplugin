name: Personal plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -X utf8 tests/test_hidden_books.py
      - run: python -X utf8 tests/test_arrivals.py
      - run: python -X utf8 tests/test_personal_runtime.py
      - run: python -X utf8 tests/test_device_regressions.py
      - run: python -X utf8 scripts/package_personal.py
      - uses: actions/upload-artifact@v4
        with:
          name: simpleui-personal-${{ runner.os }}
          path: dist/*

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/personal/pw5'
    needs: regression
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: simpleui-personal-Linux
          path: dist
      - name: Publish a new personal version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import pathlib; print(pathlib.Path("_meta.lua").read_text().split("version")[1].split(chr(34))[1])')
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release preserved. Bump the personal version to publish changes."
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SimpleUI $version" --notes-file docs/RELEASE_NOTES.md --prerelease \
            dist/simpleui.koplugin.zip dist/SHA256SUMS dist/file-hashes.json
